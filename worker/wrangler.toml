name = "kernel-github-index"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Cloudflare D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "kernel-index-db"
database_id = "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"

# Cron triggers: Execute discovery synchronization automatically every 6 hours
[triggers]
crons = ["0 */6 * * *"]

# Observability
[observability]
enabled = true
